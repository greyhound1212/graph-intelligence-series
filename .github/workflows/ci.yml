name: Harborlight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and validate datasets (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Lint Python code with Flake8
        run: |
          python -m flake8 generator neo4j tests --count --show-source --statistics --max-line-length=88 --extend-ignore=E203,W503

      - name: Generate all Harborlight datasets
        run: python generator/generate.py

      - name: Run dataset integrity tests
        run: python -m unittest discover -s tests -v
